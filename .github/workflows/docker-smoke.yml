name: Docker integration smoke test

on:
  push:
    branches: [chore/smart-tontine-validation-20261017]
    paths:
      - "backend/**"
      - "web/**"
      - "mobile/**"
      - "ops/backup/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build all service images
        run: docker compose build --pull api worker web app backup
      - name: Start database and API
        run: docker compose up -d --no-build db api
      - name: Wait for API health
        run: |
          set -euo pipefail
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4000/health; then exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=120 api db
          exit 1
      - name: Start and validate Web and mobile Web
        run: |
          set -euo pipefail
          docker compose up -d --no-build web app worker
          for port in 8080 8081; do
            ready=0
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${port}/" -o "/tmp/smart-${port}.html"; then ready=1; break; fi
              sleep 3
            done
            test "$ready" = 1
            grep -qi '<html\|<!doctype' "/tmp/smart-${port}.html"
          done
          docker compose ps
      - name: Check backup container starts
        run: |
          docker compose up -d --no-build backup
          sleep 12
          docker compose ps -a
          docker compose logs --tail=60 backup
          test "$(docker inspect -f '{{.State.Running}}' "$(docker compose ps -q backup)")" = true
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p /tmp/smart-docker-diagnostics
          docker compose ps -a > /tmp/smart-docker-diagnostics/containers.txt 2>&1 || true
          docker compose logs --no-color --tail=250 > /tmp/smart-docker-diagnostics/logs.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-smoke-diagnostics
          path: /tmp/smart-docker-diagnostics/
      - name: Stop services
        if: always()
        run: docker compose down -v --remove-orphans
