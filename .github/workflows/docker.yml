name: Images Docker

# À chaque envoi sur main : construit et publie les images sur le registre GitHub (ghcr.io).
# Sur un serveur : docker compose pull && docker compose up -d   (après « docker login ghcr.io »).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: backend, dockerfile: backend/Dockerfile }
          - { name: web, context: web, dockerfile: web/Dockerfile }
          - { name: app, context: ., dockerfile: mobile/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/mozcity/smart-tontine-${{ matrix.name }}:latest
            ghcr.io/mozcity/smart-tontine-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
