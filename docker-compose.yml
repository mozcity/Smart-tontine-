# Environnement complet local : PostgreSQL + API + back-office
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: smarttontine
      POSTGRES_PASSWORD: smarttontine
      POSTGRES_DB: smarttontine
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    depends_on: [db]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://smarttontine:smarttontine@db:5432/smarttontine
      JWT_SECRET: change-me
      PAYMENT_WEBHOOK_SECRET: change-me-webhook
      PAYMENT_PROVIDER: mock
    ports: ["4000:4000"]
volumes:
  pgdata:
