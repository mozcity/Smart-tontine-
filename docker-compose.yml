# Environnement complet : PostgreSQL + API (et back-office) + worker des tâches planifiées + plateforme web.
#   docker compose up -d --build        → site web http://localhost:8080 · app mobile (version web) http://localhost:8081
#                                         API http://localhost:4000 · back-office http://localhost:4000/admin
#   ou, sans reconstruire : docker compose pull && docker compose up -d   (images publiées par .github/workflows/docker.yml)
#   docker compose exec api node dist/src/seed.js   (données de démonstration)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: smarttontine
      POSTGRES_PASSWORD: smarttontine
      POSTGRES_DB: smarttontine
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarttontine"]
      interval: 5s
      retries: 10

  api:
    image: ghcr.io/mozcity/smart-tontine-api:latest
    build: ./backend
    depends_on: { db: { condition: service_healthy } }
    environment: &api-env
      NODE_ENV: development
      DATABASE_URL: postgres://smarttontine:smarttontine@db:5432/smarttontine
      JWT_SECRET: change-me
      PAYMENT_WEBHOOK_SECRET: change-me-webhook
      PAYMENT_PROVIDER: mock
      RUN_JOBS: "false"
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      retries: 5

  # Une seule instance exécute les tâches planifiées, quel que soit le nombre d'API.
  worker:
    image: ghcr.io/mozcity/smart-tontine-api:latest
    build: ./backend
    depends_on: { api: { condition: service_healthy } }
    environment:
      <<: *api-env
      RUN_JOBS: "true"
      PORT: "4001"

  web:
    image: ghcr.io/mozcity/smart-tontine-web:latest
    build: ./web
    depends_on: [api]
    ports: ["8080:80"]

  # Application mobile, version web : mêmes écrans que l'app Android / iPhone, dans le navigateur d'un téléphone.
  app:
    image: ghcr.io/mozcity/smart-tontine-app:latest
    build: { context: ., dockerfile: mobile/Dockerfile }
    depends_on: [api]
    ports: ["8081:80"]

  # Sauvegarde automatique de la base (ops/backup, docs/17) : chaque nuit, chiffrée, vérifiée, copiée hors serveur.
  # Fichiers dans ./backups ; restauration : docker compose exec backup restore.sh /backups/<fichier> --confirm
  backup:
    image: ghcr.io/mozcity/smart-tontine-backup:latest
    build: ./ops/backup
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGHOST: db
      PGUSER: smarttontine
      PGPASSWORD: smarttontine
      PGDATABASE: smarttontine
      BACKUP_TIME: ${BACKUP_TIME:-02:30}                 # heure UTC (= heure de Ouagadougou)
      BACKUP_ON_START: ${BACKUP_ON_START:-true}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-12}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-change-me-en-production}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-smarttontine}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-eu-central}
      BACKUP_ALERT_URL: ${BACKUP_ALERT_URL:-}
    volumes: ["./backups:/backups"]
    restart: unless-stopped

volumes:
  pgdata:
