# App mobile (version web) : fichiers statiques + relais vers l'API sur le même domaine.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  include /etc/nginx/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location ~ ^/(auth|wallet|tontines|credit|partners|goods|cagnottes|budget|projets|challenges|contrats|me|admin|public|webhooks|health|pricing|dev)(/|$) {
    # Les écrans de l'app partagent certains préfixes avec l'API (/tontines, /credit…) :
    # une navigation du navigateur (Accept: text/html) reçoit l'app, un appel de l'app reçoit l'API.
    if ($http_accept ~* "text/html") { rewrite ^ /index.html last; }
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m; # photos KYC, logos, biens
  }

  # Fichiers versionnés par Expo : cache long.
  location /_expo/ {
    include /etc/nginx/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Application monopage (Expo Router) : toute autre route renvoie index.html.
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html /index.html;
  }
}
