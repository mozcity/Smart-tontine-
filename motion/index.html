<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Smart Tontine — motion design</title>
<!--
  Vidéo de présentation de Smart Tontine (1920 × 1080, environ 65 s).
  Chaque animation est pilotée par le temps (Web Animations API) : `seek(t)` affiche l'image exacte
  à l'instant t, ce qui permet un rendu image par image (render.mjs) puis l'assemblage en MP4 avec ffmpeg.
  Ouvrir ce fichier dans un navigateur le joue aussi en direct.
-->
<style>
@font-face { font-family: 'Inter'; src: url('assets/inter.woff2') format('woff2'); font-weight: 100 900; }
:root { --brand: #2F2C8F; --brand-500: #4A46C4; --brand-800: #1C1A5C; --green: #3AA935; --green-d: #278326; --lime: #8BE086; --gold: #F0A92B; --red: #D63B3B;
  --ink: #15162C; --ink2: #4E5272; --bg: #F6F7FB; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
body { font-family: 'Inter', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--brand-800); }
.scene { position: absolute; inset: 0; opacity: 0; }
.dark { color: #fff; background: radial-gradient(1100px 600px at 85% -10%, rgba(58,169,53,.30), transparent 60%), radial-gradient(900px 700px at -10% 110%, rgba(108,103,240,.45), transparent 60%), linear-gradient(160deg, #2F2C8F 0%, #15134A 100%); }
.dark::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1.5px, transparent 1.5px); background-size: 34px 34px; }
.light { background: radial-gradient(900px 500px at 100% 0%, rgba(74,70,196,.10), transparent 60%), var(--bg); }
.abs { position: absolute; }
.center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.eyebrow { font-size: 22px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--green); }
.dark .eyebrow { color: var(--lime); }
h1 { font-size: 86px; font-weight: 850; letter-spacing: -.035em; line-height: 1.04; }
h2 { font-size: 64px; font-weight: 820; letter-spacing: -.03em; line-height: 1.08; }
h3 { font-size: 30px; font-weight: 750; letter-spacing: -.01em; }
p.lead { font-size: 30px; line-height: 1.45; color: var(--ink2); }
.dark p.lead { color: rgba(255,255,255,.82); }
em.g { font-style: normal; background: linear-gradient(90deg, var(--lime), var(--green)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.ico { width: 72px; height: 72px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.ico svg { width: 36px; height: 36px; }
.card { background: #fff; border-radius: 28px; box-shadow: 0 2px 4px rgba(21,22,44,.05), 0 30px 60px -30px rgba(21,22,44,.35); }
.glass { background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.18); border-radius: 26px; backdrop-filter: blur(6px); }
.chip { display: inline-flex; align-items: center; gap: 14px; padding: 14px 24px 14px 14px; border-radius: 999px; background: #fff; color: var(--ink); font-weight: 700; font-size: 26px; box-shadow: 0 20px 40px -18px rgba(0,0,0,.45); }
.chip i { width: 46px; height: 46px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-weight: 850; font-size: 16px; color: #fff; }
/* Téléphone */
.phone { position: absolute; width: 400px; height: 846px; border-radius: 62px; background: #0E0F1C; padding: 14px; box-shadow: 0 60px 120px -40px rgba(0,0,0,.7), inset 0 0 0 2px #2A2C45; }
.phone .scr { width: 100%; height: 100%; border-radius: 48px; overflow: hidden; position: relative; background: #F6F7FB; }
.phone .scr img { position: absolute; left: 0; right: 0; top: 46px; width: 100%; height: calc(100% - 46px); object-fit: cover; object-position: top; }
.phone::after { content: ''; position: absolute; top: 26px; left: 50%; width: 110px; height: 30px; margin-left: -55px; border-radius: 20px; background: #0E0F1C; }
/* Ordinateur */
.laptop { position: absolute; width: 1180px; }
.laptop .lid { background: #0E0F1C; border-radius: 26px 26px 0 0; padding: 22px 22px 26px; box-shadow: 0 60px 120px -40px rgba(0,0,0,.7); }
.laptop .scr { height: 680px; border-radius: 8px; overflow: hidden; position: relative; background: #F6F7FB; }
.laptop .scr img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top left; }
.laptop .base { height: 26px; margin: 0 -70px; background: linear-gradient(#D9DBE7, #A9ACC0); border-radius: 0 0 26px 26px; }
.logo svg { width: 100%; height: 100%; }
.wipe { position: absolute; top: 0; bottom: 0; width: 2400px; left: -2400px; z-index: 50; background: linear-gradient(90deg, var(--green) 0 18%, var(--brand) 18% 100%); }
.step { width: 330px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; }
.step .n { width: 120px; height: 120px; border-radius: 36px; display: flex; align-items: center; justify-content: center; background: #fff; box-shadow: 0 30px 50px -24px rgba(21,22,44,.35); position: relative; color: var(--brand); }
.step .n svg { width: 52px; height: 52px; }
.step .n b { position: absolute; top: -14px; right: -14px; width: 46px; height: 46px; border-radius: 50%; background: var(--green-d); color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; }
.step p { font-size: 22px; color: var(--ink2); line-height: 1.4; }
.row { display: flex; align-items: center; gap: 22px; }
.feat { display: flex; align-items: center; gap: 24px; padding: 22px 28px; }
.feat b { display: block; font-size: 30px; font-weight: 750; }
.feat span { font-size: 22px; opacity: .78; }
.badge { display: inline-flex; padding: 8px 18px; border-radius: 999px; font-weight: 750; font-size: 22px; }
</style>
</head>
