<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Tontine — prototype interactif</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#15162c;background:#f6f7fb;--brand:#2f2c8f;--green:#278326;--line:#dce2ea}
*{box-sizing:border-box}body{margin:0}header{background:var(--brand);color:white;padding:1rem 1.5rem}header h1{font-size:1.25rem;margin:0}header p{margin:.25rem 0 0;font-size:.85rem}main{max-width:1250px;margin:auto;padding:1rem;display:grid;grid-template-columns:250px minmax(0,1fr);gap:1rem}
aside,.screen,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:1rem}aside{align-self:start}nav{max-height:75vh;overflow:auto}nav button{width:100%;display:block;text-align:left;background:white;color:#121729;border:0;border-radius:8px;padding:.7rem;cursor:pointer}nav button[aria-current="page"]{background:#f1f0fd;color:#1c1a5c;font-weight:700}
.screen{min-height:560px}.eyebrow{color:#4e5272;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em}h2{margin:.5rem 0 1rem}h3{font-size:1rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem}.panel{background:#f8f9fc;min-height:125px}.panel p{font-size:.85rem;color:#4e5272}.actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.5rem}button.action{border:0;border-radius:10px;padding:.8rem 1rem;background:var(--brand);color:white;font-weight:700;cursor:pointer}button.secondary{background:#e3e1fa;color:#1c1a5c}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
label{display:block;font-weight:600;margin:.8rem 0 .3rem}input,select{width:100%;max-width:360px;padding:.8rem;border:1px solid #687084;border-radius:8px;font:inherit}.notice{padding:.75rem;border-left:4px solid var(--green);background:#ecf8ec;margin-top:1rem}.error{border-left-color:#b42337;background:#fff0f2}footer{padding:1rem;text-align:center;color:#4e5272;font-size:.8rem}
@media(max-width:750px){main{grid-template-columns:1fr}nav{max-height:170px}.screen{min-height:420px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header><h1>Smart Tontine · Prototype interactif</h1><p>Simulation d'interface sans données personnelles ni paiements réels</p></header>
<main><aside><label for="scope">Application</label><select id="scope"><option value="mobile">Mobile</option><option value="membre">Web membre</option><option value="partenaire">Web partenaire</option><option value="public">Site public</option></select><h3>Écrans</h3><nav id="navigation" aria-label="Écrans du prototype"></nav></aside><section class="screen" aria-live="polite"><div class="eyebrow" id="sectionName"></div><h2 id="title"></h2><div class="grid" id="panels"></div><div id="form"></div><div class="actions" id="actions"></div><div id="status" role="status"></div></section></main>
<footer>Prototype de recette UX · Les montants sont fictifs · Aucune API n'est appelée.</footer>
<script>
const SCREENS={
mobile:{"Connexion":["Numéro de téléphone","Code SMS","Vérification"],"Accueil":["Mon jeton","Mes tontines","Activité récente"],"Portefeuille":["Solde","Déposer","Retirer","Transférer"],"Dépôt":["Montant","Canal de paiement","Récapitulatif"],"Retrait":["Montant","Compte destinataire","Confirmation"],"Transfert":["Bénéficiaire","Montant","Récapitulatif"],"Historique":["Opérations","Filtres","Détails"],"Tontines":["Mes tontines","Découvrir","Créer"],"Détail tontine":["Membres","Cotisations","Tours"],"Rejoindre une tontine":["Code","Aperçu","Adhésion"],"Cagnottes":["Mes coffres","Créer","Membres"],"Détail cagnotte":["Solde","Cotisations","Validation"],"E-caisse":["Épargne bloquée","Objectif","Déblocage"],"Biens":["Catalogue","Partenaires","Commandes"],"Projets":["Objectifs","Progression","Échéances"],"Challenges":["Défis","Points","Progression"],"Contrats":["Contrats","Signature","Échéancier"],"Vérification d’identité":["Documents","Vérification","Statut"],"Support":["Questions fréquentes","Demande","Suivi"],"Suppression de compte":["Conséquences","Vérification","Demande"]},
membre:{"Accueil membre":["Solde","Tontines","Notifications"],"Tontines":["Liste","Créer","Rejoindre"],"Détail tontine":["Tours","Membres","Cotisations"],"Portefeuille":["Solde","Opérations","Historique"],"Coffres":["Liste","Création","Retraits"],"Détail coffre":["Solde","Membres","Approbations"],"Crédit":["Score","Offres","Échéancier"],"Biens":["Catalogue","Plans","Commandes"],"Identité":["Documents","Statut","Sécurité"],"Profil":["Coordonnées","Préférences","Session"]},
partenaire:{"Tableau de bord":["Membres actifs","Collecté ce mois","Frais de gestion"],"Groupes":["Tontines","Coffres","Création"],"Membres":["Liste","Défaillants","Export"],"Catalogue":["Produits","Prix","Stock"],"Commandes":["À traiter","Livraison","Historique"],"Finances":["Solde","Factures","Relevés"],"Équipe":["Collaborateurs","Rôles","Invitations"],"Paramètres":["Entreprise","Logo","Autorisations"]},
public:{"Accueil public":["Découvrir Smart Tontine","Comment ça marche","Nous rejoindre"],"Tarifs":["Offres","Comparaison","Questions"],"Découvrir":["Tontines publiques","Biens","Recherche"],"Partenaires":["Réseau","Catégories","Contact"],"Devenir partenaire":["Entreprise","Coordonnées","Demande"],"Connexion":["Téléphone","Code SMS","Accès"],"Rejoindre":["Invitation","Groupe","Confirmation"],"Confidentialité":["Données","Finalités","Droits"],"Mentions légales":["Éditeur","Conditions","Contact"],"Suppression compte":["Demande","Identité","Confirmation"]}
};
const el=id=>document.getElementById(id);let scope="mobile",screen="Connexion";const keys=()=>Object.keys(SCREENS[scope]);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function navigate(s){screen=s;history.replaceState(null,"","#"+encodeURIComponent(scope+"/"+screen));render()}
function render(){el("scope").value=scope;el("navigation").innerHTML=keys().map(s=>'<button type="button" data-screen="'+escapeHTML(s)+'" '+(s===screen?'aria-current="page"':'')+'>'+escapeHTML(s)+'</button>').join("");el("sectionName").textContent=scope;el("title").textContent=screen;el("panels").innerHTML=SCREENS[scope][screen].map((x,i)=>'<div class="panel"><h3>'+escapeHTML(x)+'</h3><p>'+escapeHTML(i===0?"Résumé du module":i===1?"Informations et états":"Actions et détails")+'</p></div>').join("");el("status").innerHTML="";const form=["Connexion","Dépôt","Retrait","Transfert","Rejoindre une tontine","Devenir partenaire"].includes(screen);el("form").innerHTML=form?'<label for="demoInput">'+(screen==="Connexion"?"Numéro de téléphone":screen==="Devenir partenaire"?"Nom de l’entreprise":"Valeur de démonstration")+'</label><input id="demoInput" autocomplete="off" placeholder="Saisie de démonstration" aria-describedby="demoHelp"><p id="demoHelp">Les données saisies ne sont pas envoyées.</p>':"";const next=keys()[(keys().indexOf(screen)+1)%keys().length];el("actions").innerHTML='<button class="action" id="primary" type="button">Continuer</button><button class="action secondary" id="next" type="button">Écran suivant →</button>';el("primary").onclick=()=>{const v=el("demoInput")?.value.trim();el("status").innerHTML=form&&!v?'<div class="notice error">Complétez le champ pour poursuivre la simulation.</div>':'<div class="notice">Étape simulée. Aucune opération réelle effectuée.</div>'};el("next").onclick=()=>navigate(next);el("navigation").querySelectorAll("button").forEach(b=>b.onclick=()=>navigate(b.dataset.screen))}
el("scope").onchange=e=>{scope=e.target.value;screen=keys()[0];navigate(screen)};try{const h=decodeURIComponent(location.hash.slice(1)).split("/");if(SCREENS[h[0]]?.[h[1]]){scope=h[0];screen=h[1]}}catch{}render();
</script></body></html>
