<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2F2C8F" />
    <meta name="description" content="Smart Tontine : la tontine en ligne sûre, adossée à la microfinance. Cotisez par Orange Money, Moov Money ou Wave, recevez votre pot à votre tour." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Thème appliqué avant l'affichage : pas d'éclair blanc en mode sombre.
      try { var t = localStorage.getItem('smarttontine_theme') || 'system';
        document.documentElement.dataset.theme = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; } catch (e) {}
    </script>
    <title>Smart Tontine — la tontine en ligne sûre</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
