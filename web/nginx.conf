# Plateforme web Smart Tontine : fichiers statiques + relais vers l'API sur le même domaine.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server_tokens off;
  include /etc/nginx/security-headers.conf;

  # Routes de l'API (et back-office) relayées au conteneur « api ».
  location ~ ^/(auth|wallet|tontines|credit|partners|goods|cagnottes|budget|projets|challenges|contrats|me|admin|public|webhooks|health|pricing)(/|$) {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m; # photos KYC, logos, biens
  }

  # Fichiers versionnés par Vite : cache long.
  location /assets/ {
    expires 1y;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Application monopage : toute autre route renvoie index.html.
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
