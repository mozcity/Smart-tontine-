# En-têtes de sécurité, inclus dans CHAQUE bloc location : nginx n'hérite pas des add_header du niveau
# supérieur dès qu'un bloc en déclare un (piège relevé par le test d'intrusion interne).
# CSP identique à celle de l'API (backend/src/app.ts).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
